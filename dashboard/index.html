<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Decluttering Agent - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="header-content">
                <h1 class="dashboard-title">Digital Decluttering Agent</h1>
                <p class="dashboard-subtitle">Intelligent file analysis and recommendations</p>
            </div>
            <div class="header-actions">
                <button id="refreshBtn" class="btn btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M13.5 2.5a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-3a1 1 0 1 1 0-2h1.586l-1.793-1.793a4.5 4.5 0 1 0 1.414 1.414L13.5 4.328V5.5a1 1 0 1 1 2 0v-3a1 1 0 0 1-1-1z"/>
                    </svg>
                    Refresh Data
                </button>
            </div>
        </header>

        <!-- Summary Cards -->
        <section class="summary-section">
            <div class="summary-card">
                <div class="summary-icon" style="background: #0f62fe;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/>
                        <path d="M7 10h2v7H7zm4-3h2v10h-2zm4 6h2v4h-2z"/>
                    </svg>
                </div>
                <div class="summary-content">
                    <h3 class="summary-value" id="totalFiles">-</h3>
                    <p class="summary-label">Total Old Files</p>
                </div>
            </div>

            <div class="summary-card">
                <div class="summary-icon" style="background: #198038;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
                    </svg>
                </div>
                <div class="summary-content">
                    <h3 class="summary-value" id="totalSize">-</h3>
                    <p class="summary-label">Total Size</p>
                </div>
            </div>

            <div class="summary-card">
                <div class="summary-icon" style="background: #fa4d56;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                    </svg>
                </div>
                <div class="summary-content">
                    <h3 class="summary-value" id="recommendDelete">-</h3>
                    <p class="summary-label">Recommended for Deletion</p>
                </div>
            </div>

            <div class="summary-card">
                <div class="summary-icon" style="background: #8a3ffc;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                    </svg>
                </div>
                <div class="summary-content">
                    <h3 class="summary-value" id="lastScan">-</h3>
                    <p class="summary-label">Last Scan</p>
                </div>
            </div>
        </section>

        <!-- Category Tabs -->
        <section class="categories-section">
            <div class="tabs-container">
                <button class="tab-btn active" data-category="all">All Files</button>
                <button class="tab-btn" data-category="documents">Documents</button>
                <button class="tab-btn" data-category="media">Media</button>
                <button class="tab-btn" data-category="archives">Archives</button>
                <button class="tab-btn" data-category="downloads">Downloads</button>
                <button class="tab-btn" data-category="other">Other</button>
            </div>

            <!-- Category Content -->
            <div class="category-content">
                <div class="category-header">
                    <h2 id="categoryTitle">All Files</h2>
                    <div class="category-stats">
                        <span id="categoryCount">0 files</span>
                        <span class="separator">•</span>
                        <span id="categorySize">0 MB</span>
                    </div>
                </div>

                <!-- Filters -->
                <div class="filters-container">
                    <div class="filter-group">
                        <label for="searchFilter">Search</label>
                        <input type="text" id="searchFilter" placeholder="Search files..." class="filter-input">
                    </div>
                    
                    <div class="filter-group">
                        <label for="sizeMinFilter">Min Size (MB)</label>
                        <input type="number" id="sizeMinFilter" placeholder="0" min="0" class="filter-input filter-input-small">
                    </div>
                    
                    <div class="filter-group">
                        <label for="sizeMaxFilter">Max Size (MB)</label>
                        <input type="number" id="sizeMaxFilter" placeholder="∞" min="0" class="filter-input filter-input-small">
                    </div>
                    
                    <div class="filter-group">
                        <label for="fileTypeFilter">File Type</label>
                        <select id="fileTypeFilter" class="filter-select">
                            <option value="all">All Types</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label for="lastAccessFilter">Last Accessed</label>
                        <select id="lastAccessFilter" class="filter-select">
                            <option value="all">All Time</option>
                            <option value="6months">6+ months ago</option>
                            <option value="1year">1+ year ago</option>
                            <option value="2years">2+ years ago</option>
                            <option value="3years">3+ years ago</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label for="recommendationFilter">Recommendation</label>
                        <select id="recommendationFilter" class="filter-select">
                            <option value="all">All</option>
                            <option value="delete">Delete</option>
                            <option value="archive">Archive</option>
                            <option value="review">Review</option>
                            <option value="keep">Keep</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <button id="clearFilters" class="btn btn-secondary btn-small">Clear Filters</button>
                    </div>
                </div>

                <!-- Bulk Actions Bar -->
                <div class="bulk-actions-bar" id="bulkActionsBar" style="display: none;">
                    <div class="bulk-actions-left">
                        <span id="selectedCount">0 files selected</span>
                    </div>
                    <div class="bulk-actions-right">
                        <button id="selectAllBtn" class="btn btn-secondary btn-small">Select All</button>
                        <button id="deselectAllBtn" class="btn btn-secondary btn-small">Deselect All</button>
                        <button id="moveToTrashBtn" class="btn btn-warning btn-small">
                            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" style="margin-right: 4px;">
                                <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
                                <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
                            </svg>
                            Move to Trash
                        </button>
                        <button id="deleteSelectedBtn" class="btn btn-danger btn-small">
                            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" style="margin-right: 4px;">
                                <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8 2.146 2.854Z"/>
                            </svg>
                            Delete Permanently
                        </button>
                    </div>
                </div>

                <!-- Files Table -->
                <div class="table-container">
                    <table class="files-table">
                        <thead>
                            <tr>
                                <th class="checkbox-column">
                                    <input type="checkbox" id="selectAllCheckbox" title="Select all visible files">
                                </th>
                                <th>File Name</th>
                                <th>Location</th>
                                <th>Size</th>
                                <th>Last Accessed</th>
                                <th>Type</th>
                                <th>Recommendation</th>
                            </tr>
                        </thead>
                        <tbody id="filesTableBody">
                            <!-- Files will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Insights Section -->
        <section class="insights-section">
            <h2 class="section-title">Insights & Recommendations</h2>
            <div class="insights-grid" id="insightsGrid">
                <!-- Insights will be populated here -->
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
